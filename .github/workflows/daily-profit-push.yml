name: Daily Profit Push

on:
  schedule:
    - cron: "5 0-10 * * *"
    - cron: "35 0-10 * * *"
  workflow_dispatch:
    inputs:
      source_mode:
        description: "powerbi_scrape (production) / http_json"
        required: false
        default: "powerbi_scrape"
      dry_run:
        description: "Run without sending WeCom messages"
        required: false
        type: boolean
        default: false

jobs:
  push-profit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: daily-profit-push
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read

    env:
      TZ: Asia/Shanghai
      GH_TOKEN: ${{ github.token }}
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      PROFIT_DATA_JSON_URL: ${{ secrets.PROFIT_DATA_JSON_URL }}
      PROFIT_DATA_JSON_HEADERS: ${{ secrets.PROFIT_DATA_JSON_HEADERS }}
      POWERBI_STORAGE_STATE_B64: ${{ secrets.POWERBI_STORAGE_STATE_B64 }}
      POWERBI_REPORT_URL: ${{ vars.POWERBI_REPORT_URL }}
      TARGET_DATA_LAG_DAYS: ${{ vars.TARGET_DATA_LAG_DAYS || '2' }}
      MAX_DATA_LAG_DAYS: ${{ vars.MAX_DATA_LAG_DAYS || '2' }}
      REQUIRE_CITY_DETAILS: "true"
      WECOM_MAX_ATTEMPTS: ${{ vars.WECOM_MAX_ATTEMPTS || '4' }}
      WECOM_TIMEOUT_SECONDS: ${{ vars.WECOM_TIMEOUT_SECONDS || '30' }}
      WECOM_RETRY_BASE_SECONDS: ${{ vars.WECOM_RETRY_BASE_SECONDS || '1.5' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r cloud_push/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Restore push state cache
        id: state-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: cloud_push/.state
          key: profit-push-state-${{ github.run_id }}
          restore-keys: |
            profit-push-state-

      - name: Restore state artifact fallback
        if: steps.state-cache-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if [ -s cloud_push/.state/state.json ]; then
            echo "state restored from cache prefix"
            exit 0
          fi
          mkdir -p /tmp/previous-profit-state cloud_push/.state
          for RUN_ID in $(gh run list --workflow daily-profit-push.yml --status completed --limit 20 \
            --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId'); do
            if gh run download "${RUN_ID}" -n "profit-push-artifacts-${RUN_ID}" \
              -D /tmp/previous-profit-state >/dev/null 2>&1; then
              python - <<'PY'
          from pathlib import Path
          import shutil
          candidates = list(Path("/tmp/previous-profit-state").rglob("state.json"))
          if candidates:
              shutil.copy2(candidates[0], "cloud_push/.state/state.json")
          PY
              if [ -s cloud_push/.state/state.json ]; then
                echo "state restored from previous workflow artifact"
                break
              fi
            fi
          done

      - name: Run cloud push
        run: |
          set -euo pipefail
          SOURCE_MODE="${{ github.event.inputs.source_mode }}"
          if [ -z "${SOURCE_MODE}" ]; then
            SOURCE_MODE="powerbi_scrape"
          fi
          if [ "${SOURCE_MODE}" = "sample" ]; then
            echo "云端工作流禁止使用 sample 数据源"
            exit 1
          fi
          if [ "${SOURCE_MODE}" = "powerbi_scrape" ] && [ -z "${POWERBI_STORAGE_STATE_B64}" ]; then
            echo "缺少 POWERBI_STORAGE_STATE_B64"
            exit 1
          fi
          DRY_ARG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DRY_ARG=""
          fi
          echo "run source mode: ${SOURCE_MODE}"
          for ATTEMPT in 1 2; do
            if python cloud_push/profit_cloud_push.py --source "${SOURCE_MODE}" ${DRY_ARG}; then
              exit 0
            fi
            if [ "${ATTEMPT}" -eq 2 ]; then
              exit 1
            fi
            echo "Power BI 抓取失败，20 秒后重试"
            sleep 20
          done

      - name: Save push state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cloud_push/.state
          key: profit-push-state-${{ github.run_id }}

      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profit-push-artifacts-${{ github.run_id }}
          path: |
            cloud_push/outputs/*.png
            cloud_push/outputs/*.md
            cloud_push/.state/state.json
          include-hidden-files: true
          if-no-files-found: ignore
